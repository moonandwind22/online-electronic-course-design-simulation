<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌与领域图标预览</title><style>
:root{--bg:#f5f7fa;--panel:#fff;--text:#172033;--muted:#667085;--border:#dce3ec;--brand:#2563eb}html[data-theme=dark]{--bg:#0c1220;--panel:#141d2e;--text:#edf3fc;--muted:#9aaac0;--border:#2b3a50;--brand:#7aa7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif}main{width:min(920px,calc(100% - 40px));margin:48px auto}h1{margin:0 0 8px;font-size:36px}p{color:var(--muted)}button{padding:9px 13px;border:1px solid var(--border);border-radius:9px;background:var(--panel);color:var(--text);cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:28px}.ui-card{display:block;padding:24px;border:1px solid var(--border);border-radius:18px;background:var(--panel);color:var(--text);text-decoration:none}.ui-card:hover{border-color:var(--brand)}.ui-icon{display:grid;place-items:center;width:64px;height:64px;margin-bottom:18px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--brand)}.ui-icon svg{width:34px;height:34px}b{display:block;font-size:15px}small{display:block;margin-top:5px;color:var(--muted);font-family:ui-monospace,monospace}</style></head><body><main><button id="theme">切换主题</button><h1>品牌与五个领域图标</h1><p>24×24 网格、1.7 描边、圆角端点；保留页面 mask/currentColor 调用方式。</p><div class="grid"><a class="ui-card" href="../assets/current/ui/brand-logo.svg" download><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 13.5h3.8l2-6.2 3.7 12 2.7-8.4 1.8 4.6h3"/><circle cx="3.5" cy="13.5" r="1.35" fill="currentColor" stroke="none"/><circle cx="20.5" cy="15.5" r="1.35" fill="currentColor" stroke="none"/><path d="M14.5 4.5h3.5l2.5 2.5v3.5"/></svg></span><b>电子课程设计品牌图标</b><small>brand-logo.svg</small></a><a class="ui-card" href="../assets/current/ui/domain-digital.svg" download><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h4v8h5V8h5v8h3"/><circle cx="3.5" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="20.5" cy="16" r="1.2" fill="currentColor" stroke="none"/><path d="M6.5 18.5h11"/></svg></span><b>数电</b><small>domain-digital.svg</small></a><a class="ui-card" href="../assets/current/ui/domain-analog.svg" download><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 14c3 0 3-8 6-8s3 8 6 8 3-8 5-8"/><path d="M3.5 18.5h17"/><path d="M7.5 18.5v2M16.5 18.5v2"/></svg></span><b>模电</b><small>domain-analog.svg</small></a><a class="ui-card" href="../assets/current/ui/domain-power.svg" download><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3.5 7.5 13h4l-1.2 7.5L17 10.5h-4z"/><path d="M3.5 12h4M16.5 12h4"/><circle cx="3.5" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="20.5" cy="12" r="1.15" fill="currentColor" stroke="none"/></svg></span><b>电力电子</b><small>domain-power.svg</small></a><a class="ui-card" href="../assets/current/ui/domain-8051.svg" download><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="5" width="10" height="14" rx="2"/><path d="M9.5 5a2.5 2.5 0 0 0 5 0"/><circle cx="9.4" cy="16.8" r="0.85" fill="currentColor" stroke="none"/><path d="M4 8.5h3M4 12h3M4 15.5h3M17 8.5h3M17 12h3M17 15.5h3"/><path d="M10.5 10.5h3M10.5 13.5h3"/></svg></span><b>8051</b><small>domain-8051.svg</small></a><a class="ui-card" href="../assets/current/ui/domain-stm32.svg" download><span class="ui-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.8"/><circle cx="9.3" cy="14.7" r="0.85" fill="currentColor" stroke="none"/><path d="M9.5 3.5V7M12 3.5V7M14.5 3.5V7M9.5 17v3.5M12 17v3.5M14.5 17v3.5M3.5 9.5H7M3.5 12H7M3.5 14.5H7M17 9.5h3.5M17 12h3.5M17 14.5h3.5"/><path d="M10.5 11.5h3v2h-3z"/></svg></span><b>STM32</b><small>domain-stm32.svg</small></a></div></main><script>document.getElementById('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'</script></body></html>
